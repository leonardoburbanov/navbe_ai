name: Feature request
description: Suggest an improvement or new capability.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Navbe behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
  - type: checkboxes
    id: mcp-surface
    attributes:
      label: Surface area
      options:
        - label: Involves new or changed MCP tools (stability-sensitive)
        - label: Involves a new domain package
        - label: Docs / DX only
